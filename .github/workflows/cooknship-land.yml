name: cooknship-land
# Generated by `cooknship init`; yours to edit. land tests the merged result in the stage job
# and pushes it in the push job. Tokens are set here; cooknship hands GH_TOKEN to git.
#
# Agents push branches that carry product code, and could carry a workflow of their own: the
# product tokens live in the environment `cooknship-land`, which only `main` may use, and
# land runs on a schedule or on demand (`gh workflow run cooknship-land`), never on a push.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    # `gh workflow run cooknship-land -f test-main=true`: each product's test on its main,
    # with this workflow's toolchains, and no landing (cooknship land --test-main).
    inputs:
      test-main:
        type: boolean
        default: false
concurrency:
  # A test-main run records nothing: its own group, so a scheduled run never replaces it.
  group: cooknship-land${{ inputs.test-main && '-test-main' || '' }}
  cancel-in-progress: false
# land writes this host (the ledger, staged merges) with COOKNSHIP_HOST_TOKEN, set on the
# checkout: GitHub's own workflow token may not push workflow files, which product trees
# carry, and its pushes trigger no workflows.
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: cooknship-land
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.COOKNSHIP_HOST_TOKEN }}
      - name: install cooknship
        run: |
          curl -fsSL https://github.com/alebairos/cooknship-machine-releases/releases/download/v0.1.30/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The tests run in a bubblewrap sandbox; Ubuntu 24.04 restricts it unless allowed.
      - run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Your toolchain here, not in --test (e.g. actions/setup-node). The tests see the
      # filesystem read-only except an empty HOME and /tmp; PATH, CARGO_HOME and RUSTUP_HOME
      # pass through, other variables need COOKNSHIP_TEST_ENV, and a toolchain under HOME
      # needs COOKNSHIP_TEST_BIND. The test command itself installs dependencies
      # (`npm ci && npm test`): it runs on a fresh export.
      - run: cooknship land ${{ inputs.test-main && '--test-main' || '--stage' }} --as ci
        env:
          GH_TOKEN: ${{ secrets.COOKNSHIP_PRODUCT_READ_TOKEN }}
  push:
    needs: stage
    if: ${{ !inputs.test-main }}
    runs-on: ubuntu-latest
    environment: cooknship-land
    # `actions: read` lets land count this workflow's own run times (machine minutes in the
    # book); `statuses: write` lets it set the commit status `cooknship` when the product is
    # this host (single-repo; other products get it with the product token). Only this job,
    # which runs no project code, gets them.
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.COOKNSHIP_HOST_TOKEN }}
      - name: install cooknship
        run: |
          curl -fsSL https://github.com/alebairos/cooknship-machine-releases/releases/download/v0.1.30/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Runs no project code: pushes exactly the commits the ledger recorded.
      - run: cooknship land --push --as ci
        env:
          COOKNSHIP_CI_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.COOKNSHIP_PRODUCT_TOKEN }}
