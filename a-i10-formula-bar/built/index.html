<!doctype html>
<!-- Evidence page (gm-a), not product code: mounts the landed web/formula_bar/formula_bar.js
     (exp-a main 9f021e6) with sample cells, unstyled, since the product ships no CSS for the bar yet. -->
<html lang="en"><head><meta charset="utf-8"><title>Formula bar (landed)</title></head><body>
<p>B1 selected: raw =A1/A2, computed #DIV/0!</p><div id="b1"></div>
<p>A1 selected: raw 2.5</p><div id="a1"></div>
<p>C1 selected: text "#DIV/0!" typed as a constant (not flagged)</p><div id="c1"></div>
<p>D1 selected: raw =A1&amp;"x", computed #VALUE!</p><div id="d1"></div>
<script type="module">
import { mount } from "./formula_bar.js";
const raw = {sheets: {Sheet1: {A1: 2.5, A2: 0, B1: "=A1/A2", C1: "#DIV/0!", D1: "=A1&\"x\""}}};
const computed = {sheets: {Sheet1: {A1: 2.5, A2: 0, B1: {error: "#DIV/0!"}, C1: "#DIV/0!", D1: {error: "#VALUE!"}}}};
for (const [id, ref] of [["b1","B1"],["a1","A1"],["c1","C1"],["d1","D1"]])
  mount(document.getElementById(id), {raw, computed, sheet: "Sheet1", ref});
</script></body></html>
